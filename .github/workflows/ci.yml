name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18, 3.3.8, 3.9.0, 3.10.0]
        java: [temurin@8, temurin@17]
        platform: [jvm, js, native]
        exclude:
          - scala: 2.13.18
            java: temurin@17
          - scala: 3.3.8
            java: temurin@17
          - scala: 3.9.0
            java: temurin@8
          - scala: 3.10.0
            java: temurin@8
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@8)
        if: matrix.java == 'temurin@8'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: sbt

      - name: Setup Java (temurin@17)
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - run: sudo apt install clang libunwind-dev libgc-dev libre2-dev

      - name: Check that workflows are up to date
        run: sbt '++ ${{ matrix.scala }}; githubWorkflowCheck'

      - name: Validate JVM
        if: matrix.platform == 'jvm'
        run: sbt '++ ${{ matrix.scala }}; validateJVM'

      - name: Validate JavaScript
        if: matrix.platform == 'js'
        run: sbt '++ ${{ matrix.scala }}; validateJS'

      - name: Validate Scala Native
        if: matrix.platform == 'native'
        run: sbt '++ ${{ matrix.scala }}; validateNative'

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [ubuntu-latest]
        scala: [2.13.18]
        java: [temurin@8]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java (temurin@8)
        if: matrix.java == 'temurin@8'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 8
          cache: sbt

      - name: Setup Java (temurin@17)
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - uses: olafurpg/setup-gpg@v3

      - env:
          CI_SNAPSHOT_RELEASE: ; ++2.13.18 publish; ++3.3.8 publish
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          CI_RELEASE: ; ++2.13.18 publishSigned; ++3.3.8 publishSigned
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: sbt ci-release
